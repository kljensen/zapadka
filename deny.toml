# Dependency policy, enforced by `cargo deny` in `cargo xtask quality`.
#
# Zapadka ships a static binary that runs against production databases, so a
# dependency is not just a build-time convenience: it is code that executes with
# migration privileges. This file states what is allowed to get in.

[graph]
# Zapadka releases Linux musl binaries; those are the targets whose dependency
# trees actually ship.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    # Developers build here, so its tree is checked too.
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# A known vulnerability in a migration tool is a release blocker, not a warning.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. Zapadka is MIT; a copyleft dependency statically
# linked into the binary would change what downstream users may do with it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots ships Mozilla's CA set as data, licensed CDLA-Permissive-2.0.
    # It is a permissive data licence with no copyleft on the using program.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# The vendored PostgreSQL parser carries BSD-3-Clause and the PostgreSQL
# License, but it is vendored source rather than a dependency, so it does not
# appear in this graph at all. `cargo xtask verify-fixtures` is what checks it.

[bans]
# Two versions of the same crate usually means a transitive dependency has not
# caught up. It is worth knowing about, but it is not on its own a defect.
multiple-versions = "allow"
wildcards = "deny"
# Nothing in Zapadka should reach for a PostgreSQL client library: ADR-0005
# requires a binary with no dynamic database-client dependency.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "postgres-native-tls" },
    { name = "pq-sys" },
    { name = "libpq-sys" },
]

[sources]
# Everything comes from crates.io. A git dependency is a version that can change
# under you, which a reproducible release cannot tolerate.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
