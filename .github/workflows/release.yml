name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for a dry run
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binary:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            platform: linux/amd64
          # aarch64 ships with v1; the job is here so both architectures are
          # built the same way rather than by two divergent recipes.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v5
        with:
          # A manual run names the tag to build. Without this it would build the
          # default branch and report the result as if it were that tag.
          ref: ${{ inputs.tag || github.ref }}

      # Built inside a pinned Alpine image rather than on the runner. Alpine's
      # Rust is musl-native, so the result is genuinely static rather than a
      # glibc build cross-compiled and hoped about. Pinning by digest means a
      # rebuild of the same tag produces the same binary.
      - name: Build in a pinned musl container
        run: .github/scripts/build-musl.sh "${{ matrix.target }}" "${{ matrix.platform }}"

      # ADR-0005 requires a binary with no dynamic database-client dependency.
      # An ELF with no NEEDED entries proves it rather than asserting it.
      - name: Prove the binary is static
        run: |
          binary=target/${{ matrix.target }}/release/zapadka
          file "$binary"
          if readelf -d "$binary" 2>/dev/null | grep -q NEEDED; then
            echo "::error::the binary has dynamic dependencies"
            readelf -d "$binary" | grep NEEDED
            exit 1
          fi

      # "Reproducible" is a claim until something checks it. The second build
      # starts from a clean target directory, so anything that leaked into the
      # binary from the build environment -- a timestamp, a path, a hostname --
      # shows up here rather than in a user's diff of two releases.
      - name: Prove the build is reproducible
        run: |
          first="$(sha256sum target/${{ matrix.target }}/release/zapadka | cut -d' ' -f1)"
          mv target "target-first-build"
          .github/scripts/build-musl.sh "${{ matrix.target }}" "${{ matrix.platform }}"
          second="$(sha256sum target/${{ matrix.target }}/release/zapadka | cut -d' ' -f1)"
          rm -rf target
          mv target-first-build target
          if [ "$first" != "$second" ]; then
            echo "::error::the build is not reproducible: $first != $second"
            exit 1
          fi
          echo "two independent builds produced $first"

      - name: Smoke test against PostgreSQL 18
        run: .github/scripts/smoke-test.sh target/${{ matrix.target }}/release/zapadka

      # An SBOM is how a downstream user answers "does this binary contain the
      # thing that was just disclosed" without rebuilding it. Generated from the
      # locked dependency graph, so it describes what was actually compiled.
      # An SBOM is how a downstream user answers "does this binary contain the
      # thing that was just disclosed" without rebuilding it. Generated from the
      # locked dependency graph, so it describes what was actually compiled.
      - name: Generate an SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --spec-version 1.5 --target ${{ matrix.target }}
          sbom="$(find . -name 'zapadka*.cdx.json' -not -path './target/*' | head -1)"
          test -n "$sbom" || { echo "::error::no SBOM was produced"; exit 1; }
          mv "$sbom" "target/${{ matrix.target }}/release/zapadka-${{ matrix.target }}.cdx.json"

      # The vendored parser and pgTAP are compiled in rather than resolved as
      # crates, so they do not appear in the dependency graph. Recording them
      # alongside the SBOM keeps the artifact list honest.
      - name: Record vendored components
        run: |
          {
            echo "# Components vendored into this binary, not resolved as crates."
            echo
            for tree in third_party/*/; do
              echo "## $(basename "$tree")"
              grep -E '^(upstream|release|revision|license|archive_sha256) ' "$tree/PROVENANCE.toml" || true
              echo
            done
          } > target/${{ matrix.target }}/release/zapadka-${{ matrix.target }}.vendored.md

      # Renamed before hashing, so `sha256sum -c` works on the files as
      # downloaded. Hashing `zapadka` and shipping `zapadka-<target>` produces a
      # checksum file that refers to a name nobody has.
      - name: Checksum
        run: |
          cd target/${{ matrix.target }}/release
          mv zapadka zapadka-${{ matrix.target }}
          sha256sum zapadka-${{ matrix.target }} > zapadka-${{ matrix.target }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: zapadka-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/zapadka-${{ matrix.target }}
            target/${{ matrix.target }}/release/zapadka-${{ matrix.target }}.sha256
            target/${{ matrix.target }}/release/zapadka-${{ matrix.target }}.cdx.json
            target/${{ matrix.target }}/release/zapadka-${{ matrix.target }}.vendored.md
          if-no-files-found: error

  publish:
    name: Publish prerelease
    needs: binary
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --prerelease \
            --title "Zapadka ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes-alpha.md \
            artifacts/*/zapadka-*
