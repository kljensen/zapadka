name: Fuzz

# Scheduled rather than per-PR. Fuzzing finds things by running for a long time,
# and a two-minute run on every pull request would mostly find nothing while
# making every pull request slower.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    name: Fuzz the parsers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked

      - uses: Swatinem/rust-cache@v2

      # The TAP parser reads text produced by a database and the TOML parsers
      # read files from a repository. Both are inputs Zapadka does not control.
      - name: Fuzz
        run: |
          for target in tap config manifest; do
            cargo +nightly fuzz run "$target" -- -max_total_time=600
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
