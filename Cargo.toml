[workspace]
resolver = "3"
members = [
    "crates/zapadka",
    "crates/zapadka-core",
    "crates/zapadka-parser",
    "crates/zapadka-pg",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/kljensen/zapadka"

[workspace.dependencies]
zapadka-core = { path = "crates/zapadka-core" }
zapadka-parser = { path = "crates/zapadka-parser" }
zapadka-pg = { path = "crates/zapadka-pg" }

anyhow = "1.0.104"
camino = "1.2.5"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
insta = { version = "1.48.0", features = ["json", "redactions"] }
schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "net"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
toml = "0.9.8"
uuid = { version = "1.24.0", features = ["v7", "serde"] }
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
