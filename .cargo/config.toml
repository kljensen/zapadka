# `cargo xtask` is not a Cargo feature; it is an alias by convention. Without
# this file the command does not exist, and every place that documents it --
# CI, the README, docs/development/code-quality.md -- is wrong.
[alias]
xtask = "run --quiet --package xtask --"

# Ask MSVC's linker for deterministic PE/COFF output. cc-rs applies the same
# option to the vendored C objects; this covers the final Rust executable.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/Brepro"]
