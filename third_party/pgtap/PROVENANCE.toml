# Provenance for pgTAP, retained as reference material.
#
# Zapadka no longer installs pgTAP. It ships its own SQL assertion library,
# which carries pgTAP's public names and argument types but records typed rows
# instead of producing TAP -- see
# docs/adr/0004-separate-deployment-verification-from-database-tests.md.
#
# This tree is kept for three reasons, none of which involve executing it:
#
#   1. Attribution. Zapadka's library is a derivative work: its API, and in
#      places its catalogue queries, come from here. The PostgreSQL Licence
#      permits that and requires the notice, which README.md carries.
#   2. A conformance reference. When Zapadka's behaviour for an assertion is in
#      question, upstream's implementation is the thing to read.
#   3. Evidence of what was derived from, at a fixed revision, so the claim can
#      be checked rather than taken on trust.
#
# `cargo xtask verify-fixtures` still re-hashes the tree and fails on any
# missing, modified, or unrecorded file. Vendored files are never edited.

format_version = 1

[source]
id = "pgtap"
upstream = "https://github.com/theory/pgtap"
release = "v1.3.4"
release_url = "https://github.com/theory/pgtap/releases/tag/v1.3.4"
revision = "968eb53a33114e83042b3bdb0c664b5b80cf8bdf"
classification = "exact"

archive = "pgtap-1.3.4.tar.gz"
archive_sha256 = "d2c951afb296a001d21785611a8e966e3f8fa3f5bfbd929396a5130c0152f314"

files_sha256 = "2f3618b610275b54879bda92af3b5e6191f5ebfcd55c9ecfb39f2e8e01c0288f"
file_count = 4

license = "PostgreSQL"
license_file = "README.md"

purpose = """
Retained as attribution for Zapadka's derivative SQL assertion API and as the
pinned conformance reference used when reviewing its behavior. Zapadka neither
compiles nor installs this source; see ADR-0004.
"""

subset = """
sql/pgtap.sql.in is the implementation reference. README.md carries the
copyright and licence notice, META.json carries the author's own licence
declaration, and pgtap.control records the upstream version. None of these files
is compiled or executed by Zapadka.
"""

# Recorded because it is a real ambiguity a reader will otherwise trip over.
license_note = """
The licence is recorded as PostgreSQL, which is what META.json declares.

README.md carries a notice with the same terms as the PostgreSQL Licence but
naming David E. Wheeler in place of the PostgreSQL Global Development Group.
The two agree in substance -- permission to use, copy, modify, and distribute
without fee, with the notice preserved, and with warranties disclaimed -- and
differ only in whose name appears.

Zapadka resolves this conservatively: it treats the terms as the PostgreSQL
Licence, and ships README.md verbatim so the notice the author actually wrote
travels with the code rather than being paraphrased.
"""

[artifact]
# Nothing here is installed, so nothing is substituted. Zapadka previously
# replaced `__VERSION__` and `__OS__` in sql/pgtap.sql.in at install time; it
# now installs its own library instead, and the placeholders in this tree are
# left exactly as upstream wrote them.
installed = false
